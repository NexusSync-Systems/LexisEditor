name: Build/Release LexisEditor (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build React bundle
        run: npm run build:react

      - name: Generate release notes
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            { echo "## Změny od $PREV"; echo ""; git log "$PREV"..HEAD --no-merges --pretty="- %s"; } > release-notes.txt
          else
            git log -1 --pretty=%B > release-notes.txt
          fi
          cat release-notes.txt

      - name: Build & publish (macOS podepsaný + notarizovaný)
        shell: bash
        run: npx electron-builder --mac --publish always -c.releaseInfo.releaseNotesFile=release-notes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
