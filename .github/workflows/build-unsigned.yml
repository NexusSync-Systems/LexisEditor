name: Build (unsigned macOS installer)

# Rychlý NEPODEPSANÝ build ke stažení jako artifact — bez Apple certifikátů.
# Použij, když podepsaný release.yml selže na podpisu/secretech, nebo když chceš
# jen rychlý .dmg na vyzkoušení. Ostrý podepsaný release dělá release.yml.
on:
  workflow_dispatch:

jobs:
  build-mac-unsigned:
    name: macOS arm64 (.dmg + .zip, bez podpisu)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build React část
        run: npm run build:react
      - name: Electron build (bez podpisu a notarizace)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip -c.mac.notarize=false -c.mac.identity=null
      - name: Seznam artefaktů
        run: ls -lh dist/*.dmg dist/*.zip || true
      - name: Nahraj instalační balíček
        uses: actions/upload-artifact@v4
        with:
          name: LexisEditor-macos-arm64-unsigned
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
