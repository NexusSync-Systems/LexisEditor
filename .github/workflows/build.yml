name: Build installer (macOS)

on:
  workflow_dispatch:      # ruční spuštění z GitHub → Actions → „Run workflow"
  push:
    tags: [ 'v*' ]        # nebo automaticky při tagu verze (v3.4.4, …)

jobs:
  build-mac:
    name: macOS (arm64, nepodepsaný .dmg + .zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build React část
        run: npm run build:react

      - name: Electron build (bez podpisu a notarizace)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # nehledej podpisový certifikát
        run: npx electron-builder --mac dmg zip -c.mac.notarize=false -c.mac.identity=null

      - name: Seznam artefaktů
        run: ls -lh dist/*.dmg dist/*.zip || true

      - name: Nahraj instalační balíček
        uses: actions/upload-artifact@v4
        with:
          name: LexisEditor-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
