name: CI

on:
  push:
    branches: [ main, master, release-prep ]
  pull_request:

jobs:
  unit:
    name: Jest (unit + DOCX/OOXML export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Run unit tests
        run: npm test -- --ci

  e2e:
    name: Playwright E2E (renderer smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E (renderer smoke + funkční smoke)
        run: npm run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # POZNÁMKA: plné Electron E2E (skutečný app proces) sem nepatří — LexisEditor
  # je macOS Electron s macOS-only API (keychain/Touch ID). Pokud bude potřeba,
  # přidá se samostatný job `runs-on: macos-latest`, který sestaví app a pustí
  # `xvfb`-free macOS Electron test. Držíme mimo tento Linux CI.
