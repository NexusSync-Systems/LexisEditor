name: CI

on:
  push:
    branches: [ main, master, release-prep ]
  pull_request:

jobs:
  test:
    name: Syntax check + Jest (unit + DOCX/OOXML export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Syntax check (main + preload + core/ui)
        run: node -e "const cp=require('child_process');const fs=require('fs');const walk=(d)=>fs.existsSync(d)?fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(d+'/'+e.name):(e.name.endsWith('.js')?[d+'/'+e.name]:[])):[];['main.js','preload.js',...walk('js')].forEach(f=>cp.execSync('node --check '+f));console.log('node --check OK')"
      - name: Run unit tests
        run: npm test

  e2e:
    name: Playwright E2E (renderer smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E (renderer smoke + funkční smoke)
        run: npm run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
